server:
  port: ${PORT:8084}

spring:
  application:
    name: investigation-service
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:investigation;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  flyway:
    enabled: true
    table: ${FLYWAY_TABLE:flyway_investigation_history}

management:
  endpoints:
    web:
      exposure:
        include: health,info

contextshield:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %5p [%X{requestId:-}] %logger{36} : %msg%n"
