# Produção / publicação: sem seed automático e sem segredo embutido.
spring:
  config:
    activate:
      on-profile: prod

contextshield:
  seed:
    enabled: ${SEED_ENABLED:false}
    allow-demo-reset: ${SEED_ALLOW_DEMO_RESET:false}
  jwt:
    allow-dev-secret: ${JWT_ALLOW_DEV_SECRET:false}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false