server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: core-api
  datasource:
    # Produção: PostgreSQL em nuvem (Neon, Supabase, Render...). Ver docs/DEPLOY.md.
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:contextshield}}
    username: ${DATABASE_USER:contextshield}
    password: ${DATABASE_PASSWORD:contextshield}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: America/Sao_Paulo
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

contextshield:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    ttl-minutes: ${JWT_TTL_MINUTES:120}
    allow-dev-secret: ${JWT_ALLOW_DEV_SECRET:true}
  risk-engine:
    url: ${RISK_ENGINE_URL:http://${RISK_ENGINE_HOSTPORT:localhost:8081}}
    timeout-ms: ${RISK_ENGINE_TIMEOUT_MS:2500}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  seed:
    enabled: ${SEED_ENABLED:false}
    credentials-file: ${SEED_CREDENTIALS_FILE:}
    anchor-today: ${SEED_ANCHOR_TODAY:true}
    allow-demo-reset: ${SEED_ALLOW_DEMO_RESET:false}
  password-change:
    per-minute-email: ${PASSWORD_CHANGE_PER_MINUTE_EMAIL:5}
  check:
    per-minute: ${CHECK_PER_MINUTE:40}
    trusted-proxies: []
  login:
    per-minute-ip: ${LOGIN_PER_MINUTE_IP:25}
    per-minute-email: ${LOGIN_PER_MINUTE_EMAIL:8}
  http:
    trusted-proxies:
      - 127.0.0.1
      - ::1
      - 172.16.0.0/12
      - 10.0.0.0/8
  ml:
    url: ${ML_SERVICE_URL:http://localhost:8082}
    timeout-ms: ${ML_TIMEOUT_MS:800}
  threat:
    url: ${THREAT_SERVICE_URL:http://localhost:8083}
    timeout-ms: ${THREAT_TIMEOUT_MS:800}
  investigation:
    url: ${INVESTIGATION_SERVICE_URL:http://localhost:8084}
    timeout-ms: ${INVESTIGATION_TIMEOUT_MS:800}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %5p [%X{requestId:-}] %logger{36} : %msg%n"
