# Perfil "local": sobe sem PostgreSQL, com H2 em memória no modo PostgreSQL.
# Use só para desenvolvimento rápido: ./mvnw -pl services/core-api spring-boot:run -Dspring-boot.run.profiles=local
spring:
  datasource:
    url: jdbc:h2:mem:contextshield;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
