server:
  port: ${PORT:8083}
  error:
    include-message: always

spring:
  application:
    name: threat-service
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:threat;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  flyway:
    enabled: true
    table: ${FLYWAY_TABLE:flyway_threat_history}

management:
  endpoints:
    web:
      exposure:
        include: health,info

contextshield:
  rate-limit-per-minute: ${RATE_LIMIT_PER_MINUTE:120}
  jwt:
    secret: ${JWT_SECRET:}
    allow-dev-secret: ${JWT_ALLOW_DEV_SECRET:false}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %5p [%X{requestId:-}] %logger{36} : %msg%n"
