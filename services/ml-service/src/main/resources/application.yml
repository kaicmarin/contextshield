server:
  port: ${PORT:8082}

spring:
  application:
    name: ml-service
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

contextshield:
  models-dir: ${MODELS_DIR:../../machine-learning/models}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %5p [%X{requestId:-}] %logger{36} : %msg%n"
