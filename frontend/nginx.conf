server {
    listen ${PORT};
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # A API fica atrás do mesmo domínio: o navegador não faz CORS e o token não sai para outro site.
    location ~ ^/(api|swagger-ui|v3/api-docs) {
        # API_URL com esquema: http://core-api:8080 no compose, https://...onrender.com no Render
        proxy_pass ${API_URL};
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
        proxy_read_timeout 30s;
    }
    location = /swagger-ui.html { proxy_pass ${API_URL}; proxy_ssl_server_name on; proxy_set_header Host $proxy_host; proxy_set_header Origin ""; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /loja {
        try_files $uri $uri/ /loja/index.html;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
    }
    location /banco {
        try_files $uri $uri/ /banco/index.html;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
    }
    location /ops {
        try_files $uri $uri/ /ops/index.html;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
    }
    location = /sistema {
        try_files /sistema.html =404;
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
    }
}
