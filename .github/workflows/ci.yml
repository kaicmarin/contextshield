name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Credenciais descartáveis só para `docker compose build` no CI — nunca produção.
env:
  DB_PASSWORD: ci-github-disposable-postgres
  CORE_DB_PASSWORD: ci-github-disposable-core
  THREAT_DB_PASSWORD: ci-github-disposable-threat
  INVESTIGATION_DB_PASSWORD: ci-github-disposable-investigation
  ML_DB_PASSWORD: ci-github-disposable-ml
  JWT_SECRET: ci-github-disposable-jwt-secret-32chars-min
  JWT_ALLOW_DEV_SECRET: "false"
  SEED_ENABLED: "false"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # testes de unidade, API, CRUD e integridade (H2 em modo PostgreSQL)
      - run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run check
      - run: npm run test:unit

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.aws-free.yml build

  deploy-isolated:
  # Validação descartável: backup + Flyway V12–V14 + health + 2º deploy (sem restaurar dump sobre dados novos).
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x scripts/aws/ci-seed-host-perms.sh scripts/aws/apply-ci-env.sh scripts/aws/fix-ci-seed-mount-perms.sh scripts/aws/validate-deploy-isolated.sh scripts/aws/deploy-app-update.sh
      - run: bash scripts/aws/validate-deploy-isolated.sh
      - name: Publicar artefato de evidência
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-isolated-report
          path: |
            docs/DEPLOY-ISOLATED-TEST.json
            docs/DEPLOY-ISOLATED-CORE-API.log