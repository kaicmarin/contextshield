# Sobe o sistema inteiro: docker compose up --build   →  http://localhost:8088
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: contextshield
      POSTGRES_USER: contextshield
      POSTGRES_PASSWORD: ${DB_PASSWORD:-contextshield}
      TZ: America/Sao_Paulo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextshield"]
      interval: 5s
      retries: 10

  risk-engine:
    build: { context: ., dockerfile: services/risk-engine/Dockerfile }
    environment:
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-com-32-caracteres-ou-mais}

  core-api:
    build: { context: ., dockerfile: services/core-api/Dockerfile }
    depends_on:
      postgres: { condition: service_healthy }
      risk-engine: { condition: service_healthy }
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/contextshield
      DATABASE_USER: contextshield
      DATABASE_PASSWORD: ${DB_PASSWORD:-contextshield}
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-com-32-caracteres-ou-mais}
      RISK_ENGINE_URL: http://risk-engine:8081
      CORS_ORIGINS: http://localhost:8088
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      core-api: { condition: service_healthy }
    ports:
      - "8088:80"

volumes:
  pgdata:
